<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13131f">
<title>Questões</title>
<style>
:root{--bg:#13131f;--card:#1a1b2e;--bd:#2a2c42;--tx:#c8cfe8;--mu:#7f86a3;--bl:#7b8ec8;--gr:#4ec990;--grbg:#0d2620;--grbd:#1d9e75;--rd:#e07070;--rdbg:#2d1a1a;--rdbd:#5a2a2a;--ye:#d4a84b}
@media(prefers-color-scheme:light){:root{--bg:#f7f5f0;--card:#fff9f0;--bd:#ddd8ce;--tx:#3d2e18;--mu:#8a7f72;--bl:#4a7fb5;--gr:#2f7a3d;--grbg:#eaf5eb;--grbd:#3a8a48;--rd:#8b1a1a;--rdbg:#fde8e8;--rdbd:#e07070;--ye:#8a5a10}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top,0) 14px calc(env(safe-area-inset-bottom,0) + 24px)}
header{display:flex;align-items:center;gap:8px;padding:14px 0 8px}
h1{font-size:20px;margin:0;flex:1}
button{font:inherit;color:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--card);border:1px solid var(--bd);cursor:pointer}
button.p{background:var(--grbd);color:#fff;border-color:var(--grbd);font-weight:600}
button.i{padding:8px 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
.now{background:var(--grbg);border-color:var(--grbd)}
.late{background:var(--rdbg);border-color:var(--rdbd)}
.mu{color:var(--mu);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;border-left:4px solid;background:var(--bg);margin-bottom:6px}
h2{font-size:14px;margin:18px 0 4px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=password]{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 12px}
.bar{height:5px;background:var(--bd);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--bl)}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;z-index:9}
.sh{background:var(--bg);width:100%;border-radius:18px 18px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom,0) + 20px);max-height:90%;overflow:auto}
.big{font-size:44px;font-weight:700;text-align:center}
input[type=range]{width:100%;height:36px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0) + 20px);background:var(--card);border:1px solid var(--bd);padding:10px 16px;border-radius:20px;z-index:10;display:none;max-width:90%}
.al{color:var(--rd);font-size:14px}
</style>
</head>
<body>
<header><h1>❓ Questões</h1><button class="i" data-a="sync" id="sy">⟳</button><button class="i" data-a="cfg">⚙</button></header>
<div id="app"></div>
<div id="toast"></div>
<script>
const API='https://api.jsonbin.io/v3/b/';
const LS=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let cfg=LS('cfg')||{},st=LS('cache'),pdfs=LS('pdfs')||{c:{},m:{}},ver=false,ext=false,busy=false,err='';
const $=s=>document.querySelector(s);
const cleanKey=s=>String(s||'').replace(/[^\x21-\x7E]/g,'');
const cleanBin=s=>{s=String(s||'');const m=s.match(/[0-9a-fA-F]{24}/);return m?m[0]:cleanKey(s)};
cfg.bin=cleanBin(cfg.bin);cfg.key=cleanKey(cfg.key);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const add=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const days=s=>Math.round((new Date(s+'T00:00:00')-new Date(ymd()+'T00:00:00'))/864e5);
const pyR=x=>Math.abs(x%1)===.5?2*Math.round(x/2):Math.round(x);
const CORES={'arquitetura de computadores':'#a78bd4','banco de dados':'#7b8ec8','d. administrativo':'#c98a4e','d.constitucional':'#7bba7a','desenvolvimento de software':'#d4a84b','engenharia de software':'#c87a9e','informatica':'#4ec990','legislacao':'#8888a0','portugues':'#e07a7a','raciocinio logico-matematico':'#9999b0','redes e seguranca':'#5bbcd6'};
const cor=m=>CORES[String(m).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()]||'#7b8ec8';
const resumo=t=>String(t||'').replace(/\s*-\s*Bloco\s*\d+\s*$/i,'');
const nz=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
function parseCSV(t){t=t.replace(/^\uFEFF/,'');const sep=(t.match(/;/g)||[]).length>(t.match(/,/g)||[]).length?';':',';
 const rows=[];let r=[],f='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;else if(c==sep){r.push(f);f=''}
  else if(c=='\n'){r.push(f);rows.push(r);r=[];f=''}else if(c!='\r')f+=c}
 if(f||r.length){r.push(f);rows.push(r)}return rows}
function setPdfs(p){if(!p.cronograma_csv)return;try{const rows=parseCSV(p.cronograma_csv),hi=rows.findIndex(r=>r.some(c=>nz(c)==='materia'));if(hi<0)return;
 const H=rows[hi].map(nz),iM=H.indexOf('materia'),iC=H.indexOf('codigo'),iP=H.indexOf('pdf'),c={},m={};
 rows.slice(hi+1).forEach(r=>{const mt=(r[iM]||'').trim(),cd=(r[iC]||'').trim(),pf=(r[iP]||'').trim();if(!mt||!pf)return;if(cd&&!c[cd])c[cd]=pf;if(!m[mt])m[mt]=pf});
 pdfs={c,m};SV('pdfs',pdfs)}catch(e){}}
const pdfDe=q=>pdfs.c[q.codigo]||pdfs.m[q.materia]||'';
function nxt(a,iv,f,r){const n=Math.min(5,Math.floor(a/2));if(n<3)return[1,Math.max(1.3,f-.2),0];
 const ni=r==0?1:r==1?6:pyR(iv*f);return[ni,Math.max(1.3,f+.1-(5-n)*.08),r+1]}
function norm(q){q=q||{};q.ativas=q.ativas||[];q.concluidas=q.concluidas||[];q.limite_diario??=10;q.alerta_nota_minima??=6;return q}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
async function fetchPkg(){const r=await fetch(API+cfg.bin+'/latest',{headers:{'X-Master-Key':cfg.key}});
 if(!r.ok)throw Error('Erro HTTP '+r.status+' (confira Bin ID e API Key)');return(await r.json()).record||{}}
async function mutate(fn){busy=true;head();try{const p=await fetchPkg();setPdfs(p);const q=norm(p.questoes);fn(q);p.questoes=q;p._sincronizado_em=new Date().toISOString();
 const r=await fetch(API+cfg.bin,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':cfg.key},body:JSON.stringify(p)});
 if(!r.ok)throw Error('Erro HTTP '+r.status+' ao salvar');st=q;SV('cache',q);toast('Salvo e sincronizado ✓')}
 catch(e){toast(e.message)}busy=false;head();render()}
async function load(){if(!cfg.bin||!cfg.key)return render();busy=true;head();
 try{const p=await fetchPkg();setPdfs(p);st=norm(p.questoes);SV('cache',st);err='';toast('Atualizado ✓')}catch(e){err=e.name==='TypeError'?'Não consegui falar com o JSONBin. Confira a internet e tente de novo.':e.message;toast(err+(st?' — mostrando cópia salva':''))}
 busy=false;head();render()}
function head(){$('#sy').textContent=busy?'…':'⟳'}
function chip(m){return`<span class="chip" style="border-color:${cor(m)}">${esc(m)}</span>`}
function card(q,now){const d=days(q.proxima_revisao||ymd()),late=d<0;
 const b=now?(late?`atrasado ${-d}d`:'revisar agora'):`em ${d} dia${d==1?'':'s'}`;
 return`<div class="card ${now?(late?'late':'now'):''}">${chip(q.materia)}<div class="row"><b>${esc(q.codigo)}</b><span class="mu">${b}</span></div>
 <div class="mu" style="margin:4px 0 8px">${esc(resumo(q.atividade))}</div>
 <div class="row"><span class="mu">${q.repeticoes||0}x seguidas</span>${now?`<button class="p" data-a="reg" data-c="${esc(q.codigo)}">Registrar acertos</button>`:''}</div></div>`}
function render(){const A=$('#app');
 if(!cfg.bin||!cfg.key){A.innerHTML=`<div class="card"><b>Conectar à nuvem</b><p class="mu">Use o mesmo Bin ID e a mesma API Key (X-Master-Key) do programa no computador.</p>
 <label class="mu">Bin ID</label><input type="text" id="b" autocapitalize="off" autocomplete="off"><label class="mu">API Key</label><input type="password" id="k" autocomplete="off">
 <button class="p" data-a="save">Conectar</button></div>`;return}
 if(!st){A.innerHTML=err?`<div class="card late"><b>Não foi possível carregar</b><p class="al">${esc(err)}</p><p class="mu">Confira se o Bin ID e a API Key (X-Master-Key) estão certos, sem espaços, e se você já clicou em Enviar para nuvem no computador.</p><button class="p" data-a="sync">Tentar de novo</button> <button data-a="reset">Trocar Bin ID / API Key</button></div>`:'<p class="mu">Carregando…</p>';return}
 const hoje=ymd(),lim=st.limite_diario,at=st.ativas,dom=st.concluidas;
 const hj=at.filter(q=>(q.proxima_revisao||hoje)<=hoje).sort((a,b)=>(a.proxima_revisao||'')<(b.proxima_revisao||'')?-1:1);
 const l7=add(7),prox=at.filter(q=>q.proxima_revisao>hoje&&q.proxima_revisao<=l7).sort((a,b)=>a.proxima_revisao<b.proxima_revisao?-1:1);
 const fut=at.filter(q=>q.proxima_revisao>l7).sort((a,b)=>a.proxima_revisao<b.proxima_revisao?-1:1);
 const resp=dom.concat(at.filter(q=>q.acertos_ultimo!=null)),tot=at.length+dom.length;
 const ta=resp.reduce((s,q)=>s+(q.acertos_ultimo||0),0),pa=resp.length?Math.round(ta/(resp.length*10)*100):0;
 const fr=resp.filter(q=>(q.acertos_ultimo||0)<st.alerta_nota_minima&&q.revisao_confirmada_nota!==q.acertos_ultimo).sort((a,b)=>a.acertos_ultimo-b.acertos_ultimo);
 let h=`<div class="row mu"><span>${resp.length}/${tot} revisados</span><span>Desempenho: ${pa}%</span></div><div class="bar" style="margin:6px 0"><i style="width:${tot?resp.length/tot*100:0}%"></i></div>`;
 fr.forEach(q=>{h+=`<div class="card late"><div class="al">⚠️ Revisar PDF — ${esc(q.materia)} [${esc(q.codigo)}] — ${q.acertos_ultimo}/10 (abaixo de ${st.alerta_nota_minima})</div>
 <div style="margin:4px 0">${pdfDe(q)?'📄 '+esc(pdfDe(q)):'<span class="mu">PDF não encontrado — envie o plano pelo computador</span>'}</div><div class="mu" style="margin:0 0 8px">${esc(resumo(q.atividade))}</div><div style="text-align:right"><button class="p" data-a="rev" data-c="${esc(q.codigo)}">✅ Já revisei</button></div></div>`});
 const dentro=hj.slice(0,lim),extras=hj.slice(lim);
 h+=`<h2>Para revisar hoje (${dentro.length} de ${lim})</h2>`;
 h+=hj.length?dentro.map(q=>card(q,1)).join(''):'<p style="color:var(--gr)">Sem revisões para hoje!</p>';
 if(extras.length){h+=`<button data-a="ext" style="width:100%">${ext?'Ocultar extras':`+ ${extras.length} extra${extras.length>1?'s':''} disponíve${extras.length>1?'is':'l'}`}</button>`;if(ext)h+=extras.map(q=>card(q,1)).join('')}
 if(prox.length)h+=`<h2>Próximos 7 dias (${prox.length})</h2>`+prox.map(q=>card(q,0)).join('');
 if(fut.length)h+=`<h2>Agendados (${fut.length})</h2>`+fut.map(q=>card(q,0)).join('');
 if(dom.length){h+=`<h2>Dominados (${dom.length})</h2><button data-a="dom" style="width:100%">${ver?'Ocultar':'Mostrar'}</button>`;
  if(ver)h+=[...dom].reverse().map(q=>`<div class="card">${chip(q.materia)}<div class="row"><b>${esc(q.codigo)}</b><span class="mu">${q.acertos_ultimo??0}/10 · ${q.intervalo||1}d</span></div>
  <div style="text-align:right;margin-top:6px"><button data-a="und" data-c="${esc(q.codigo)}">desfazer</button></div></div>`).join('')}
 A.innerHTML=h}
function sheet(h){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="sh">${h}</div>`;o.addEventListener('click',e=>{if(e.target===o)o.remove()});document.body.appendChild(o);return o}
function regModal(cod){const c=st.ativas.find(x=>x.codigo===cod);if(!c)return;
 const o=sheet(`${chip(c.materia)}<div><b>${esc(c.codigo)}</b></div><div class="mu">${esc(resumo(c.atividade))}</div><p>Quantas você acertou? (de 10)</p>
 <div class="big" id="v">7 / 10</div><input type="range" id="r" min="0" max="10" value="7"><div class="mu" id="pv" style="text-align:center;margin-bottom:14px"></div><button class="p" id="ok" style="width:100%">Salvar</button>`);
 const r=o.querySelector('#r'),pv=()=>{const a=+r.value,[ni]=nxt(a,c.intervalo||1,c.facilidade||2.5,c.repeticoes||0);
  o.querySelector('#v').textContent=a+' / 10';o.querySelector('#v').style.color=a>=7?'var(--gr)':a>=5?'var(--ye)':'var(--rd)';
  o.querySelector('#pv').textContent=(Math.floor(a/2)>=3?'ok':'repetir')+' · próxima revisão em '+ni+' dia'+(ni==1?'':'s')+' ('+add(ni)+')'};
 r.oninput=pv;pv();
 o.querySelector('#ok').onclick=()=>{const a=+r.value;o.remove();mutate(q=>{const k=q.ativas.find(x=>x.codigo===cod);if(!k)throw Error('Questão não encontrada — atualize.');
  const[ni,nf,nr]=nxt(a,k.intervalo||1,k.facilidade||2.5,k.repeticoes||0);
  Object.assign(k,{acertos_ultimo:a,intervalo:ni,facilidade:Math.round(nf*1000)/1000,repeticoes:nr,proxima_revisao:add(ni)});
  (k.historico=k.historico||[]).push({data:ymd(),acertos:a,intervalo:ni});
  const d=q.ativas.filter(x=>(x.intervalo||0)>21);q.ativas=q.ativas.filter(x=>(x.intervalo||0)<=21);q.concluidas=q.concluidas.concat(d)})}}
function cfgModal(){const o=sheet(`<b>Configurações</b><p class="mu">Limite de questões por dia</p><input type="range" id="l" min="1" max="30" value="${st?st.limite_diario:10}"><div id="lv" class="mu"></div>
 <p class="mu">Nota mínima aceitável por bloco (alerta abaixo disso)</p><input type="range" id="n" min="0" max="10" value="${st?st.alerta_nota_minima:6}"><div id="nv" class="mu"></div>
 <button class="p" id="s" style="width:100%;margin-bottom:10px">Salvar</button><button id="x" style="width:100%">Trocar Bin ID / API Key</button>`);
 const l=o.querySelector('#l'),n=o.querySelector('#n'),u=()=>{o.querySelector('#lv').textContent=l.value+' por dia';o.querySelector('#nv').textContent='abaixo de '+n.value+' de 10'};l.oninput=n.oninput=u;u();
 o.querySelector('#s').onclick=()=>{o.remove();if(st)mutate(q=>{q.limite_diario=+l.value;q.alerta_nota_minima=+n.value})};
 o.querySelector('#x').onclick=()=>{o.remove();cfg={};SV('cfg',cfg);render()}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,c=t.dataset.c;
 if(busy&&a!=='cfg')return;
 if(a==='sync')load();else if(a==='cfg')cfgModal();else if(a==='reg')regModal(c);
 else if(a==='reset'){cfg={};SV('cfg',cfg);err='';st=null;render()}else if(a==='ext'){ext=!ext;render()}else if(a==='dom'){ver=!ver;render()}
 else if(a==='save'){cfg={bin:cleanBin($('#b').value),key:cleanKey($('#k').value)};if(!cfg.bin||!cfg.key){toast('Preencha o Bin ID e a API Key.');return}SV('cfg',cfg);load()}
 else if(a==='rev')mutate(q=>{const k=q.ativas.concat(q.concluidas).find(x=>x.codigo===c);if(k)k.revisao_confirmada_nota=k.acertos_ultimo});
 else if(a==='und'){if(confirm('Mover '+c+' de volta para revisão? O intervalo volta para 1 dia.'))mutate(q=>{const k=q.concluidas.find(x=>x.codigo===c);if(!k)throw Error('Não encontrada — atualize.');
  q.concluidas=q.concluidas.filter(x=>x!==k);Object.assign(k,{intervalo:1,facilidade:Math.max(1.3,(k.facilidade||2.5)-.2),repeticoes:0,proxima_revisao:ymd()});q.ativas.unshift(k)})}});
if(st)render();load();
</script>
</body>
</html>
